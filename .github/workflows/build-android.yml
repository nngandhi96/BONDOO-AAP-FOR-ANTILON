name: Build Android APK and AAB

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: |
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>Bondoo</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # Locate sdkmanager in pre-installed Android SDK
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager > /dev/null 2>&1; then
            SDKM="sdkmanager"
          else
            SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          
          echo "Found sdkmanager at: $SDKM"
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses || true
            "$SDKM" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true
          fi

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (For direct phone installation & testing)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build_debug.log || {
            echo "### ❌ Debug APK Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 25 -B 2 "\* What went wrong:" build_debug.log >> $GITHUB_STEP_SUMMARY || tail -n 100 build_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            while IFS= read -r line; do
              echo "::error title=Gradle::$line"
            done < <(grep -A 15 "\* What went wrong:" build_debug.log || tail -n 25 build_debug.log)
            exit 1
          }

      - name: Build Release AAB (For Google Play Store upload)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build_release.log || {
            echo "### ❌ Release AAB Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 25 -B 2 "\* What went wrong:" build_release.log >> $GITHUB_STEP_SUMMARY || tail -n 100 build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            while IFS= read -r line; do
              echo "::error title=Gradle::$line"
            done < <(grep -A 15 "\* What went wrong:" build_release.log || tail -n 25 build_release.log)
            exit 1
          }

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bondoo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: bondoo-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: |
            android/build_debug.log
            android/build_release.log
          retention-days: 7
