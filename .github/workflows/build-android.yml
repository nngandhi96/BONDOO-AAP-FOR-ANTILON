name: Build Android APK and AAB

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'

      - name: Accept Android SDK Licenses & Install Platform 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ensure web assets folder exists
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><body>Bondoo</body></html>' > dist/index.html
          npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (For direct phone installation & testing)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release AAB (For Google Play Store upload)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bondoo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: bondoo-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
